name: BI · CI

on:
  push:
    paths:
      - "005-2026-BI-INTELIGENCIA-NEGOCIO/**"
  pull_request:
    paths:
      - "005-2026-BI-INTELIGENCIA-NEGOCIO/**"

defaults:
  run:
    working-directory: 005-2026-BI-INTELIGENCIA-NEGOCIO

jobs:
  verify:
    name: Ratchets grep-based
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all ratchets
        run: bash scripts/ratchets/run-all.sh

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: 005-2026-BI-INTELIGENCIA-NEGOCIO/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: 005-2026-BI-INTELIGENCIA-NEGOCIO/package-lock.json
      - run: npm ci
      - run: npm run test:unit
        env:
          JWT_SECRET: test-secret-local-bi-spec001
          PI_BASE_URL: https://pi.innovadataco.com
          PORT: "3001"

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: [typecheck, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: 005-2026-BI-INTELIGENCIA-NEGOCIO/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          JWT_SECRET: test-secret-local-bi-spec001
          PI_BASE_URL: https://pi.innovadataco.com
          PORT: "3001"
