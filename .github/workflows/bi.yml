name: BI · CI (005 retirado)

on:
  push:
  pull_request:

# Sentinel multi-producto histórico (SPEC-299 / BRIEF A-49). El producto 005
# (BI Inteligencia de Negocio v1) fue ELIMINADO del repo el 2026-09-03 por
# orden del CEO: Superset/Vanna quedaron apagados en el VPS y el BI activo es
# el 006-2026-BI-INTELIGENCIA-NEGOCIO (workflow bi-006.yml).
#
# Este workflow queda a propósito como `bi-gate` trivial: el check "bi-gate"
# figura en el ruleset "Gate CI - main" de TODOS los PR (patrón cross-producto
# heredado), y retirarlo de golpe bloquearía los merges de PI. Cuando el
# responsable ajuste la protección de rama, este archivo también se elimina.
jobs:
  bi-gate:
    runs-on: ubuntu-latest
    steps:
      - name: 005 retirado — BI activo en 006
        run: 'echo "bi-gate: 005 eliminado del repo (2026-09-03). El BI vivo es el 006 (bi-006.yml)."'
