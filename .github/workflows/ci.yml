# SPEC-107 (cola 025, B3-c): CI mínimo como compuerta real — tsc + lint + test + build.
# Alcance: SOLO el producto 002-2026-PROTECCION-INFANTIL (monorepo por productos).
# Fix 002-PI-027 (§3.1 auditoría): .env.test generado en CI (no está en git),
# placeholders de build (email.ts/Prisma los exige en page-data) y `prisma generate`
# explícito antes de tsc.
# 002-PI-063: jobs paralelos (verificaciones, test, journeys, build) + gate agregador.
# 002-PI-068: split del job test en test-unit (sin BD) + test-integration (con BD).
name: ci-002-proteccion-infantil

on:
  push:
    branches: [feature/001-scaffolding]
  pull_request:
  workflow_dispatch:
    inputs:
      # SPEC-407 (I-282 caso A): palanca on-demand para activar la medición de
      # handles vivos con wtfnode + dumps en el `afterAll` global. Sin depender
      # de una rama viva. Alternativa dormida: setear la variable de repo
      # `SPEC_407_DEBUG_HANDLES` en `1` para dejarla activa por un período.
      debug_handles:
        description: "SPEC-407 · activar wtfnode + dumps en test-integration para cazar caso A"
        type: boolean
        default: false

# SPEC-396 (I-282): cada repush cancela la corrida vieja. Sin esto, dos runs del
# mismo commit peleaban por la BD compartida (`lock not available` en PermisoModulo,
# shards que se cancelaban solos, coverage sin blob para fusionar). Sale más barato
# y evita el rojo fantasma que ya cazó a #279 (shard) y #298 (colgada). Excepción
# para `main`: aunque este flujo hoy no dispara en push a main (solo a
# feature/001-scaffolding + pull_request), la condición está por defensa por si el
# trigger cambia; en cualquier rama principal no queremos cancelar a mitad.
concurrency:
  group: ci-002-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # SPEC-107 (doc-only) + SPEC-374 (PRs que no tocan PI): un job skipped reporta
  # conclusión "skipped", que GitHub trata como éxito en required checks. Por eso
  # decidimos acá, NUNCA con `on: paths:` — un paths-ignore dejaría los checks de
  # PI (requeridos) PENDIENTES y bloquearía los merges de otros productos (trampa
  # I-249). La lógica vive en un módulo aparte (should-skip-pi.mjs) para tenerla
  # bajo tests unitarios; en el runner solo la invocamos.
  should-skip:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: detect
        run: |
          files_changed=$(git diff --name-only HEAD^ HEAD || true)
          # ubuntu-latest ya trae node preinstalado; no hace falta setup-node acá.
          skip=$(printf "%s" "$files_changed" | node 002-2026-PROTECCION-INFANTIL/scripts/ci/should-skip-pi.mjs)
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  verificaciones:
    runs-on: ubuntu-latest
    needs: [should-skip]
    if: needs.should-skip.outputs.skip != 'true'
    defaults:
      run:
        working-directory: 002-2026-PROTECCION-INFANTIL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 002-2026-PROTECCION-INFANTIL/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      # SPEC-157 (D2): ratchet anti color crudo.
      - run: npm run tokens:check
      # SPEC-126: compuerta de la línea base de arquitectura.
      - run: npm run arch:check
      # SPEC-284 (002-PI-184 · I-130): compuerta de IDs de advisory lock únicos.
      - run: npm run locks:check
      # SPEC-287 (002-PI-187 · I-25/I-111/I-141): 4 ratchets anti-recaída del
      # bucle de guardián en layout (x-invoke-path, redirect en layout, self-redirect
      # en action, invariante destino ∈ exentas).
      - run: npm run ratchets:check
      # SPEC-296 (002-PI-197 · cierra I-152): impide bypass del motor de notificaciones.
      # Solo se permite `resend.emails.send()` bajo `src/lib/notificaciones/`
      # (envío real del motor) y `src/lib/email/` (notificacion-spam.ts, ya en el motor).
      - name: Ratchet Resend fuera del motor
        run: |
          set -e
          BYPASS=$(grep -rn "resend\.emails\.send" src/ --include="*.ts" --include="*.tsx" \
              | grep -v "src/lib/notificaciones/" \
              | grep -v "src/lib/email/" \
              | grep -v "\.test\." || true)
          if [ -n "$BYPASS" ]; then
              echo "❌ Nuevo callsite Resend directo fuera del motor:"
              echo "$BYPASS"
              exit 1
          fi
          echo "✅ Cero bypasses Resend fuera del motor."
      # SPEC-413: el índice `specs/README.md` se genera desde cada spec.md.
      # El check compara el archivo commiteado con la regeneración fresca; si
      # difiere, el mensaje indica el comando exacto para arreglarlo. Corta el
      # ciclo de "conflictos de rebase" que hacía de specs/README.md el archivo
      # que más chocaba en el repo (03-09-2026: #324, #327/#329, #308).
      - run: npx tsx scripts/specs/generar-readme.ts --check

  test-unit:
    runs-on: ubuntu-latest
    needs: [should-skip]
    if: needs.should-skip.outputs.skip != 'true'
    defaults:
      run:
        working-directory: 002-2026-PROTECCION-INFANTIL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 002-2026-PROTECCION-INFANTIL/package-lock.json
      - run: npm ci
      - name: Generar .env.test (dummy, solo CI)
        run: |
          cat > .env.test <<'ENV_EOF'
          DATABASE_URL=postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
          PARAM_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          ANTI_ABUSO_SALT=test-anti-abuso-salt-min-32-chars
          NEXT_PUBLIC_APP_URL=http://localhost:5005
          OLLAMA_BASE_URL=http://localhost:11434
          EMAIL_FROM=test@ci.local
          ENV_EOF
      - run: npx prisma generate
      # 002-PI-068: tests sin base de datos, paralelizables.
      - run: npm run test:unit

  test-integration:
    runs-on: ubuntu-latest
    needs: [should-skip]
    if: needs.should-skip.outputs.skip != 'true'
    # SPEC-375 · SPEC-407: TOPE DURO por shard.
    # Cada intento individual usa `timeout 45m` en el shell (ver step "Correr
    # shard"). El tope del job acomoda hasta DOS intentos secuenciales
    # (45m + 45m + overhead ≈ 100m).
    #
    # HISTORIAL de calibración (importa porque el número anterior lo puse mal):
    # - 28m/intento (03-09 17:3x): fijado mirando la corrida sana MÁS RÁPIDA
    #   observada, no la distribución real. Cortó corridas legítimas de 32m
    #   que existían antes del tope. Dev 02 midió shard 3 en 6 corridas:
    #   17·32·59·18·18·58 — rango normal 17-33m. 28 parte esa distribución
    #   por la mitad. Un tope se fija con la DISTRIBUCIÓN, no con el promedio.
    # - 45m/intento (esta versión): 33m es el máximo sano observado; 45 da
    #   margen real y sigue cortando las anomalías tipo B (~55-60m). Cuando
    #   la mediana del shard más lento suba, se revisa este tope.
    timeout-minutes: 100
    # Mega-lote 002-PI: shard 4 vías (~28min → ~7min por shard). Cada shard corre en
    # su propio runner con su propio Postgres: no hay BD compartida entre shards.
    # Los umbrales de cobertura se evalúan en el job agregador (test-integration-coverage).
    strategy:
      fail-fast: false
      matrix:
        # SPEC-450 (I-282): de 4 a 6 shards. La suite pesa ~57 min de test puro;
        # con 4 daba ~14 min teóricos y corría en 17-19, y el PEOR caso medido
        # fue 43,3 min — el 96 % del techo de 45. Cruzarlo dispara el reintento
        # de SPEC-407 y el job termina en 63-90 min, que es lo que se veía como
        # «colgado». Con 6 quedan ~10 min teóricos y el peor caso proyectado
        # baja a ~28: margen real contra un runner lento.
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: 002-2026-PROTECCION-INFANTIL
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: proteccion
          POSTGRES_PASSWORD: proteccion_dev
          POSTGRES_DB: proteccion_infantil_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U proteccion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 002-2026-PROTECCION-INFANTIL/package-lock.json
      - run: npm ci
      - name: Generar .env.test (dummy, solo CI)
        run: |
          cat > .env.test <<'ENV_EOF'
          DATABASE_URL=postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
          PARAM_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          ANTI_ABUSO_SALT=test-anti-abuso-salt-min-32-chars
          NEXT_PUBLIC_APP_URL=http://localhost:5005
          OLLAMA_BASE_URL=http://localhost:11434
          EMAIL_FROM=test@ci.local
          ENV_EOF
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
      # SPEC-251 (I-49): guardián de índices críticos — PR rojo si alguno falta o tiene tipo incorrecto.
      - run: npm run indices:check
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
      - run: node scripts/ensure-pgboss.mjs
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
      - run: npx prisma generate
      # 002-PI-068: tests con base de datos y singleFork (mutex TestMutex).
      # Mega-lote: shard N/4. Umbrales de cobertura en 0 aquí (se evalúan al mergear
      # los 6 blobs en test-integration-coverage); blob = resultados + cobertura.
      # SPEC-281 (002-PI-180): reparto por peso medido (test-durations.json).
      # Si el JSON existe → se pasan los archivos como positional args (sin --shard).
      # Si NO existe → fallback a --shard=N/M con M = el largo de la matriz (el
      # script sale sin imprimir). SPEC-450: el rótulo del step y el fallback
      # salen del MISMO número que la matriz. Cuando decía «/4» sobre una corrida
      # de 6, el log del CI afirmaba algo que el código no hacía — la clase que
      # esta misma spec vino a cerrar, en su propio archivo.
      - name: Correr shard ${{ matrix.shard }}/${{ strategy.job-total }} (SPEC-281 reparto por peso o fallback)
        # SPEC-407 caso B (runner GHA lento): wrapper con `timeout 45m` + reintento
        # SÓLO por timeout de shell (exit 124). Un test rojo (exit ≠ 124) NO reintenta
        # nunca. El reintento se ve en el resumen del run (::warning + GITHUB_STEP_SUMMARY)
        # y queda contable para futuras auditorías. Candados aprobados por CEO 17:3x.
        run: |
          set +e
          run_vitest() {
            local ARCHIVOS
            ARCHIVOS="$(node scripts/ci/reparto-shards.mjs --shard=${{ matrix.shard }}/6 --durations test-durations.json)"
            if [ -n "$ARCHIVOS" ]; then
              echo "[ci] reparto por peso activo (SPEC-281): $(echo $ARCHIVOS | wc -w) archivos"
              timeout 45m node --env-file=.env.test --import tsx ./node_modules/vitest/vitest.mjs run --coverage.enabled --coverage.thresholds.lines=0 --coverage.thresholds.statements=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --reporter=default --reporter=blob --outputFile.blob=blobs/shard-${{ matrix.shard }}.json $ARCHIVOS
            else
              echo "[ci] fallback a --shard=${{ matrix.shard }}/6 (SPEC-281 no aplicó)"
              timeout 45m node --env-file=.env.test --import tsx ./node_modules/vitest/vitest.mjs run --shard=${{ matrix.shard }}/6 --coverage.enabled --coverage.thresholds.lines=0 --coverage.thresholds.statements=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --reporter=default --reporter=blob --outputFile.blob=blobs/shard-${{ matrix.shard }}.json
            fi
          }

          INICIO=$SECONDS
          run_vitest
          EXIT=$?
          # SPEC-450 (I-282) · SEÑAL TEMPRANA, no corte. El techo sigue siendo
          # `timeout 45m`: esto solo avisa cuando un shard se acerca, para verlo
          # ANTES de que lo toque. La deriva del 04-09 pasó de 18 a 43 min sin
          # que nadie se enterara hasta que un job pareció colgado.
          DURACION=$(( SECONDS - INICIO ))
          if [ "$DURACION" -ge 1800 ] && [ "$EXIT" -ne 124 ]; then
            echo "::warning title=SPEC-450 · shard ${{ matrix.shard }} lento::Tardó $(( DURACION / 60 )) min (umbral de aviso: 30). El techo son 45: si sigue subiendo, el próximo cruza y el job termina en 63-90 min."
            echo "- **SPEC-450**: shard ${{ matrix.shard }} tardó $(( DURACION / 60 )) min (aviso ≥30, techo 45). Revisar deriva de la suite o refrescar \`test-durations.json\`." >> "$GITHUB_STEP_SUMMARY"
          fi

          # SPEC-407: SOLO reintentar por timeout de shell (exit 124). Ningún
          # otro exit code (0 = pass, 1 = test rojo, cualquier otro) reintenta.
          # Reintentar un fallo de test real sería lo peor que se podría construir.
          if [ "$EXIT" -eq 124 ]; then
            echo "::warning title=SPEC-407 · shard ${{ matrix.shard }} reintento por timeout::Runner GHA lento (caso B). Primer intento tomó >45 min; reintentando UNA vez."
            echo "- **SPEC-407 caso B**: shard ${{ matrix.shard }} reintentado (primer intento exit 124 = timeout). Runner lento, no test rojo." >> "$GITHUB_STEP_SUMMARY"
            run_vitest
            EXIT=$?
            if [ "$EXIT" -eq 0 ]; then
              echo "  - Segundo intento verde. Reintento contable para ratchet." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$EXIT" -eq 124 ]; then
              echo "  - Segundo intento también timeout. Investigar runner o suite." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "  - Segundo intento falló con exit $EXIT (test rojo o error). Ver log del step." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          exit $EXIT
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
          # SPEC-407 (I-282 caso A) · palanca on-demand para la medición de
          # handles vivos. DEFAULT: vacío (afterAll global se comporta idéntico
          # a hoy — cero cambios de comportamiento para las suites que pasan).
          # Se activa por DOS caminos, cualquiera de los dos alcanza:
          # (1) `gh workflow run ci-002-proteccion-infantil.yml -f debug_handles=true`
          #     (disparo manual, controlado por PR o quien lance).
          # (2) Variable de repo `SPEC_407_DEBUG_HANDLES = 1` (Settings → Variables),
          #     que la deja activa por un período sin necesidad de disparar nada.
          # No depende de ninguna rama viva — sobrevive al merge del PR SPEC-407.
          VITEST_DEBUG_HANDLES: ${{ (inputs.debug_handles && '1') || vars.SPEC_407_DEBUG_HANDLES || '' }}
      - uses: actions/upload-artifact@v4
        # Sube el blob incluso si el shard falló: el job agregador mergea los 6 y
        # reporta los tests fallidos con detalle (y el ratchet se evalúa sobre la
        # suite completa cuando todo va verde). Sin esto, un shard rojo dejaba al
        # agregador sin blobs y fallaba por umbrales parciales (ruido).
        if: ${{ !cancelled() }}
        with:
          name: coverage-blob-${{ matrix.shard }}
          path: 002-2026-PROTECCION-INFANTIL/blobs/
          retention-days: 1

  test-integration-coverage:
    runs-on: ubuntu-latest
    needs: [should-skip, test-integration]
    # Agrega los 4 shards: re-reporta resultados (fallos de tests salen aquí con
    # detalle) y aplica el ratchet de cobertura global de 002-PI-068.
    if: ${{ needs.should-skip.outputs.skip != 'true' && !cancelled() }}
    defaults:
      run:
        working-directory: 002-2026-PROTECCION-INFANTIL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 002-2026-PROTECCION-INFANTIL/package-lock.json
      - run: npm ci
      - name: Generar .env.test (dummy, solo CI)
        run: |
          cat > .env.test <<'ENV_EOF'
          DATABASE_URL=postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
          PARAM_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          ANTI_ABUSO_SALT=test-anti-abuso-salt-min-32-chars
          NEXT_PUBLIC_APP_URL=http://localhost:5005
          OLLAMA_BASE_URL=http://localhost:11434
          EMAIL_FROM=test@ci.local
          ENV_EOF
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-blob-*
          path: 002-2026-PROTECCION-INFANTIL/blobs
          merge-multiple: true
      # SPEC-280 (002-PI-180): además de texto, emite JSON de tests y coverage
      # (json-summary) para que el job `resumen` los consuma.
      - run: npx vitest run --config vitest.config.ts --mergeReports blobs --coverage.enabled --coverage.reporter=text --coverage.reporter=json-summary --reporter=default --reporter=json --outputFile.json=vitest-summary.json
      - uses: actions/upload-artifact@v4
        # SPEC-280: los suministros del resumen se suben incluso si el merge falló
        # (para pintar "resumen parcial" en vez de perder la pestaña Summary).
        if: ${{ !cancelled() }}
        with:
          name: resumen-inputs
          path: |
            002-2026-PROTECCION-INFANTIL/vitest-summary.json
            002-2026-PROTECCION-INFANTIL/coverage/coverage-summary.json
          retention-days: 1
          if-no-files-found: warn
      # SPEC-281 (002-PI-180): actualiza test-durations.json con media móvil de
      # esta corrida. Solo en la rama base (feature/001-scaffolding). Nunca falla el CI.
      - name: Actualizar test-durations.json (SPEC-281, solo rama base)
        if: ${{ github.ref == 'refs/heads/feature/001-scaffolding' && !cancelled() }}
        run: |
          node scripts/ci/actualizar-duraciones.mjs --vitest-json vitest-summary.json --durations test-durations.json || echo "[ci] actualizar-duraciones falló; sigo"
      - uses: actions/upload-artifact@v4
        # El JSON actualizado se sube siempre como artifact para que Fábrica lo
        # commitee a mano si el bot no puede pushear a la rama base.
        if: ${{ !cancelled() }}
        with:
          name: test-durations-actualizado
          path: 002-2026-PROTECCION-INFANTIL/test-durations.json
          retention-days: 7
          if-no-files-found: ignore

  journeys:
    runs-on: ubuntu-latest
    needs: [should-skip]
    if: needs.should-skip.outputs.skip != 'true'
    defaults:
      run:
        working-directory: 002-2026-PROTECCION-INFANTIL
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: proteccion
          POSTGRES_PASSWORD: proteccion_dev
          POSTGRES_DB: proteccion_infantil_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U proteccion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 002-2026-PROTECCION-INFANTIL/package-lock.json
      - run: npm ci
      - name: Generar .env.test (dummy, solo CI)
        run: |
          cat > .env.test <<'ENV_EOF'
          DATABASE_URL=postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
          PARAM_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          ANTI_ABUSO_SALT=test-anti-abuso-salt-min-32-chars
          NEXT_PUBLIC_APP_URL=http://localhost:5005
          OLLAMA_BASE_URL=http://localhost:11434
          EMAIL_FROM=test@ci.local
          ENV_EOF
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
      # SPEC-251 (I-49): guardián de índices críticos.
      - run: npm run indices:check
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
      - run: node scripts/ensure-pgboss.mjs
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
      - run: npx prisma generate
      # SPEC-133 (Q-1): journeys por rol como paso propio.
      - run: npm run test:journeys
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test

  build:
    runs-on: ubuntu-latest
    needs: [should-skip]
    if: needs.should-skip.outputs.skip != 'true'
    defaults:
      run:
        working-directory: 002-2026-PROTECCION-INFANTIL
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: proteccion
          POSTGRES_PASSWORD: proteccion_dev
          POSTGRES_DB: proteccion_infantil_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U proteccion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 002-2026-PROTECCION-INFANTIL/package-lock.json
      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: 002-2026-PROTECCION-INFANTIL/.next/cache
          key: ${{ runner.os }}-next-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-
      - run: npm ci
      - name: Generar .env.test (dummy, solo CI)
        run: |
          cat > .env.test <<'ENV_EOF'
          DATABASE_URL=postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
          PARAM_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          ANTI_ABUSO_SALT=test-anti-abuso-salt-min-32-chars
          NEXT_PUBLIC_APP_URL=http://localhost:5005
          OLLAMA_BASE_URL=http://localhost:11434
          EMAIL_FROM=test@ci.local
          ENV_EOF
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
      # SPEC-251 (I-49): guardián de índices críticos.
      - run: npm run indices:check
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
      - run: node scripts/ensure-pgboss.mjs
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
      - run: npx prisma generate
      # Placeholders SOLO de build.
      - run: npm run build
        env:
          RESEND_API_KEY: build-placeholder
          EMAIL_FROM: build@ci.local
          ANTI_ABUSO_SALT: build-placeholder-salt-min-32-chars
          DATABASE_URL: postgresql://build:build@localhost:5432/build

  # SPEC-280 (002-PI-180): resumen legible al final de cada corrida. Corre siempre
  # que el CI haya arrancado (verde, rojo o cancelado) — la pestaña "Summary" debe
  # existir aunque un shard se cayera. Nunca rompe el gate.
  resumen:
    runs-on: ubuntu-latest
    needs: [should-skip, verificaciones, test-unit, test-integration, test-integration-coverage, journeys, build]
    if: ${{ needs.should-skip.outputs.skip != 'true' && always() }}
    defaults:
      run:
        working-directory: 002-2026-PROTECCION-INFANTIL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: resumen-inputs
          path: 002-2026-PROTECCION-INFANTIL
        continue-on-error: true
      - name: Consultar duración de los jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" > jobs.json || echo '{"jobs":[]}' > jobs.json
      - name: Escribir resumen en la pestaña Summary
        run: |
          VITEST_JSON=""
          COVERAGE_JSON=""
          test -f vitest-summary.json && VITEST_JSON="--vitest-json vitest-summary.json" || true
          test -f coverage-summary.json && COVERAGE_JSON="--coverage-json coverage-summary.json" || true
          node scripts/ci/resumen.mjs --jobs-json jobs.json --piso-lineas 36 $VITEST_JSON $COVERAGE_JSON >> "$GITHUB_STEP_SUMMARY"

  gate:
    runs-on: ubuntu-latest
    needs: [should-skip, verificaciones, test-unit, test-integration, test-integration-coverage, journeys, build]
    if: needs.should-skip.outputs.skip != 'true'
    steps:
      - name: Gate passed
        run: echo "All checks passed"

  # Sentinel multi-producto (SPEC-299 / BRIEF A-49). Ver .github/workflows/README.md.
  # Reporta un veredicto agregado único al ruleset "Gate CI - main":
  # - Cualquier `needs.*.result` == failure o cancelled  → sentinel falla.
  # - Todos success o skipped (mezcla incluida)          → sentinel pasa.
  # Correr `if: always()` es lo que permite que reporte también cuando algún job fue skipped.
  pi-gate:
    runs-on: ubuntu-latest
    needs: [should-skip, verificaciones, test-unit, test-integration, test-integration-coverage, journeys, build]
    if: always()
    steps:
      - name: Evaluar veredicto agregado
        run: |
          set -euo pipefail
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ pi-gate: al menos un job requerido falló."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ pi-gate: al menos un job requerido fue cancelado."
            exit 1
          fi
          echo "✅ pi-gate: todos los jobs requeridos pasaron o fueron skipped."
