# SPEC-107 (cola 025, B3-c): CI mínimo como compuerta real — tsc + lint + test + build.
# Alcance: SOLO el producto 002-2026-PROTECCION-INFANTIL (monorepo por productos).
# Fix 002-PI-027 (§3.1 auditoría): .env.test generado en CI (no está en git),
# placeholders de build (email.ts/Prisma los exige en page-data) y `prisma generate`
# explícito antes de tsc.
name: ci-002-proteccion-infantil

on:
  push:
    branches: [feature/001-scaffolding]
    paths:
      - "002-2026-PROTECCION-INFANTIL/**"
  pull_request:
    paths:
      - "002-2026-PROTECCION-INFANTIL/**"
  # Permite disparar el gate a mano (p.ej. tras un fix del propio CI, cuyo paths no cubre la raíz)
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 002-2026-PROTECCION-INFANTIL
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          # Mismas credenciales dummy que test-setup.ts y docker-compose.yml (dev, no secretos)
          POSTGRES_USER: proteccion
          POSTGRES_PASSWORD: proteccion_dev
          POSTGRES_DB: proteccion_infantil_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U proteccion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 002-2026-PROTECCION-INFANTIL/package-lock.json
      - run: npm ci
      # .env.test no está en git: se genera con valores DUMMY (test-setup.ts sobreescribe
      # los sensibles). Node 22 aborta con --env-file si el archivo no existe.
      - name: Generar .env.test (dummy, solo CI)
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL=postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
          PARAM_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          ANTI_ABUSO_SALT=test-anti-abuso-salt
          NEXT_PUBLIC_APP_URL=http://localhost:5005
          OLLAMA_BASE_URL=http://localhost:11434
          EMAIL_FROM=test@ci.local
          EOF
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://proteccion:proteccion_dev@localhost:5433/proteccion_infantil_test
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      # La suite comparte una única Postgres (fileParallelism: false en vitest.config).
      # Los tests que llaman modelos van con mocks (ollama-client mockeado).
      - run: npm run test
      # SPEC-126: compuerta de la línea base de arquitectura — regenera los 5 artefactos
      # de docs/architecture/ y falla si difieren de lo commiteado, si hay un modelo
      # huérfano no declarado, o si las aserciones A (puerta ≡ predicado) / B (menú
      # honesto) detectan desalineo. No necesita BD ni servicios (lee código como texto).
      - run: npm run arch:check
      # Placeholders SOLO de build: email.ts valida RESEND_API_KEY/EMAIL_FROM al importarse
      # y Prisma/cola pide DATABASE_URL al recolectar page data (mismo patrón del Dockerfile).
      - run: npm run build
        env:
          RESEND_API_KEY: build-placeholder
          EMAIL_FROM: build@ci.local
          DATABASE_URL: postgresql://build:build@localhost:5432/build
