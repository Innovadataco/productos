# SPEC-487 (D-109) · Barrido post-merge de los generados append-por-spec.
#
# Los 3 generados a los que CADA spec/ruta le agrega una fila —specs/README.md,
# docs/architecture/02-roles-capacidades.md, 03-pantallas.md— dejaron de tocarse
# en los PR (el gate del PR verifica REPRESENTABILIDAD, no committed==regen). Eso
# saca esos archivos de la cadena de conflictos: `merge=union` bajaba el dolor del
# rebase local pero GitHub NO lo aplica server-side → cada PR que los editaba
# quedaba CONFLICTING contra el siguiente (medido en toda la Ola 2).
#
# Este job los mantiene al día: corre sobre `main` fresco tras cada merge, los
# regenera, y si driftearon PUSHEA una rama y el OPERADOR abre el PR (flujo B,
# D-110, ya validado en vivo en #406 — nada de `gh pr create`). Es idempotente y
# AUTO-TERMINANTE: cuando el PR del barrido mergea, regen==committed → sin drift →
# no abre otro. Nunca commitea directo a main.
#
# Ventana de lag aceptable: entre un merge y el merge del PR del barrido, el índice
# committeado trasciende la fuente por unas filas; como el gate del PR ya no exige
# igualdad, nadie se pone rojo y la FUENTE siempre es correcta (el índice es
# documentación, consistencia eventual).
name: generados-post-merge-002-proteccion-infantil

on:
  push:
    branches: [main]
    paths:
      - "002-2026-PROTECCION-INFANTIL/specs/**"
      - "002-2026-PROTECCION-INFANTIL/src/**"
      - "002-2026-PROTECCION-INFANTIL/prisma/schema.prisma"
      - "002-2026-PROTECCION-INFANTIL/scripts/arch/**"
      - "002-2026-PROTECCION-INFANTIL/docs/architecture/**"
  workflow_dispatch:

# Cada corrida reconcilia el estado COMPLETO de main; una corrida vieja es
# descartable → cancel-in-progress:true (a diferencia del --tension, que no
# cancela porque reescribe un número monotónico).
concurrency:
  group: generados-post-merge-002
  cancel-in-progress: true

jobs:
  barrido:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushea la rama del bot (el operador abre el PR — flujo B)
      issues: write # SPEC-885 (I-443): abre/reusa el Issue de aviso (label generados-drift)
      pull-requests: read # SPEC-885 (I-443): detecta si ya hay un PR abierto del barrido (convergencia)
    defaults:
      run:
        working-directory: 002-2026-PROTECCION-INFANTIL
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # siempre sobre main fresco
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 002-2026-PROTECCION-INFANTIL/package-lock.json
      - run: npm ci

      # Regenera los generados desde la fuente de main: los append-por-spec (02/03) y
      # SPEC-803 también los antes-byte-exactos (00/01/06). El gate del PR ya NO los compara
      # byte a byte (solo REPRESENTABILIDAD); acá se mantienen al día sobre main y se detecta
      # su drift — así un PR de schema en ráfaga no deja `main` rojo ni obliga a rebasar a todos.
      - name: Regenerar índice + tablas de arquitectura
        run: |
          npx tsx scripts/specs/generar-readme.ts
          npx tsx scripts/arch/generar-roles-capacidades.ts
          npx tsx scripts/arch/generar-pantallas.ts
          npx tsx scripts/arch/generar-indice.ts
          npx tsx scripts/arch/generar-modelo-datos.ts
          npx tsx scripts/arch/generar-stack.ts

      - name: ¿Hubo drift?
        id: diff
        run: |
          ARCHIVOS="specs/README.md docs/architecture/00-INDICE.md docs/architecture/01-modelo-datos.md docs/architecture/02-roles-capacidades.md docs/architecture/03-pantallas.md docs/architecture/06-stack.md"
          if git diff --quiet -- $ARCHIVOS; then
            echo "cambio=no" >> "$GITHUB_OUTPUT"
            echo "Los generados ya reflejan main (idempotente). Nada que abrir."
          else
            echo "cambio=si" >> "$GITHUB_OUTPUT"
            git diff --stat -- $ARCHIVOS
          fi

      # Tras regenerar, arch:check sigue verde (byte-exactos + aserciones).
      - name: Verificar arch:check tras regenerar
        if: steps.diff.outputs.cambio == 'si'
        run: npm run arch:check

      # SPEC-885 (I-443) · CONVERGENCIA: si YA hay un PR abierto del barrido, el operador lo está
      # atendiendo — NO re-pusheamos (un force-push le resetea los checks/aprobación y nunca converge).
      # Cuando ese PR mergee, el próximo push a main re-dispara este job y, si sigue habiendo drift,
      # abre la siguiente ronda. Consistencia eventual, sin tocar ningún gate.
      - name: ¿Ya hay un PR abierto del barrido?
        id: pr
        if: steps.diff.outputs.cambio == 'si'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ABIERTOS=$(gh pr list --repo "$GITHUB_REPOSITORY" --head work/pi-SPEC-487-generados --state open --json number --jq 'length')
          echo "abierto=$ABIERTOS" >> "$GITHUB_OUTPUT"
          if [ "$ABIERTOS" != "0" ]; then
            echo "Ya hay $ABIERTOS PR abierto del barrido; no re-pusheo (convergencia). El operador lo cierra y el próximo push re-dispara."
          fi

      # El bot SOLO pushea la rama — NO abre el PR (flujo B, D-110, validado en #406). El OPERADOR
      # lo abre como usuario real: (a) esquiva el permiso de create de Actions (OFF) y (b) dispara los
      # required checks (actor real). La rama matchea `verificar-base-pr.yml` (^work/pi-SPEC-[0-9]+-).
      # SPEC-885: notificación REAL al operador via Issue con label fijo `generados-drift` (NO un
      # ::notice que nadie ve). Se REUSA el Issue abierto (comentario) en vez de spamear uno por push;
      # sin @mención — el operador es la sesión rotativa del CEO, que vigila por label.
      - name: Pushear la rama y abrir/reusar el Issue de aviso
        if: steps.diff.outputs.cambio == 'si' && steps.pr.outputs.abierto == '0'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RAMA="work/pi-SPEC-487-generados"
          git config user.email "bot-generados@innovadataco.local"
          git config user.name "bot-generados-post-merge"
          git checkout -B "$RAMA"
          git add 002-2026-PROTECCION-INFANTIL/specs/README.md \
                  002-2026-PROTECCION-INFANTIL/docs/architecture/02-roles-capacidades.md \
                  002-2026-PROTECCION-INFANTIL/docs/architecture/03-pantallas.md
          git commit -m "chore(generados): regenerar índice + tablas de arquitectura post-merge (SPEC-487)"
          git push --force origin "$RAMA"
          # Notificación REAL: Issue con label fijo, reusado si ya hay uno abierto (no spam).
          REPO="$GITHUB_REPOSITORY"
          NUEVO_PR="https://github.com/$REPO/pull/new/$RAMA"
          DIFF="https://github.com/$REPO/compare/main...$RAMA"
          CUERPO=$(printf '%s\n' \
            "Los generados append-por-spec (specs/README.md, docs/architecture/02-roles-capacidades.md, 03-pantallas.md) driftearon tras un merge a \`main\`. La rama \`$RAMA\` quedó regenerada sobre main fresco (arch:check verde) y pusheada." \
            "" \
            "**Operador (flujo B, D-110):** abrí el PR — $NUEVO_PR · diff: $DIFF" \
            "" \
            "_Aviso automático del barrido post-merge (SPEC-487 / SPEC-885). Este Issue se REUSA; se cierra solo al mergear el PR del barrido._")
          gh label create generados-drift --repo "$REPO" --color FBCA04 --description "Barrido de generados post-merge (SPEC-487) pendiente de PR del operador" 2>/dev/null || true
          EXISTE=$(gh issue list --repo "$REPO" --label generados-drift --state open --json number --jq '.[0].number // ""')
          if [ -n "$EXISTE" ]; then
            gh issue comment "$EXISTE" --repo "$REPO" --body "$CUERPO"
            echo "::notice::Reusé el Issue #$EXISTE (label generados-drift)."
          else
            gh issue create --repo "$REPO" --title "Generados driftearon — abrir PR del barrido (SPEC-487)" --label generados-drift --body "$CUERPO"
            echo "::notice::Abrí un Issue nuevo (label generados-drift)."
          fi
