# ==========================================================================
# CI del producto 008 (INVERSIONES). Archivo propio de 008: no edita los
# workflows de PI ni de BI. Patrón sentinel multi-producto: ver README.md.
#
# Condiciones del CEO de PI (2026-11-20):
#  5. No corre en PRs ni pushes de PI. En push solo con cambios en 008/** o en
#     este archivo. En PR todos los jobs se saltan salvo en ramas work/inv-*,
#     así un PR de PI nunca ve un rojo de 008.
#  6. Candado de frontera: una rama work/inv-* que toque CUALQUIER archivo
#     fuera de 008-2026-INVERSIONES/ o de este archivo falla (ECC no mergea
#     fuera de su frontera; eso lo hace cumplir el CI, no una promesa).
#  INV-SPEC-6: permisos de solo lectura, sin credenciales persistidas y base_ref por env.
#  (Sin filtro de rutas en pull_request a propósito: si una rama work/inv-*
#   tocara SOLO archivos de PI, con filtro de rutas este workflow no correría y
#   la frontera no se verificaría.)
# ==========================================================================
name: inv

on:
  push:
    branches: [main]
    paths:
      - "008-2026-INVERSIONES/**"
      - ".github/workflows/inv.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: inv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Condición 6: frontera de 008, solo en PR de ramas work/inv-*.
  frontera-008:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'work/inv-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prueba por mutación de la frontera
        run: bash 008-2026-INVERSIONES/scripts/ci/frontera-008.test.sh
      - name: La rama solo toca 008-2026-INVERSIONES/ e inv.yml (chequeo de 008; el que manda es frontera-008-main)
        env:
          BASE_REF: ${{ github.base_ref }}
        # Compatible con las dos versiones del script: la vieja lee la lista por stdin,
        # la nueva (INV-SPEC-4) la calcula ella misma con el argumento.
        run: git -c core.quotepath=off diff --no-renames --name-only "origin/${BASE_REF}...HEAD" | bash 008-2026-INVERSIONES/scripts/ci/frontera-008.sh "origin/${BASE_REF}"

  # Candado: el repo es PÚBLICO; ningún dato real (extractos, capturas, .env) entra.
  candado-datos-reales:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'work/inv-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prueba por mutación del candado
        run: bash 008-2026-INVERSIONES/scripts/ci/candado-datos-reales.test.sh
      - name: Sin datos reales versionados
        run: git ls-files 008-2026-INVERSIONES | bash 008-2026-INVERSIONES/scripts/ci/candado-datos-reales.sh

  # INV-SPEC-7: la app de 008 (Next.js + Prisma). Tipos, pruebas unitarias, integración contra
  # una PostgreSQL 16 de servicio (base *_test, la única que acepta scripts/integracion.mjs) y build.
  # Misma condición de rama que los demás jobs (condición 5 del CEO de PI).
  app-008:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'work/inv-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 008-2026-INVERSIONES
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inversiones
          POSTGRES_PASSWORD: inversiones_ci # valor de CI, no es un secreto
          POSTGRES_DB: inversiones_test
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U inversiones -d inversiones_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://inversiones:inversiones_ci@localhost:5438/inversiones_test?schema=public
      DATABASE_URL_TEST: postgresql://inversiones:inversiones_ci@localhost:5438/inversiones_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: 008-2026-INVERSIONES/.nvmrc
          cache: npm
          cache-dependency-path: 008-2026-INVERSIONES/package-lock.json
      - name: Instalar dependencias (lockfile)
        run: npm ci
      - name: Cliente de Prisma
        run: npx prisma generate
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas unitarias (candados del esquema y la infraestructura)
        run: npm test
      - name: Pruebas de integración (reglas de la base)
        run: npm run test:integracion
      - name: Build
        run: npm run build

  # Sentinel multi-producto (SPEC-299 / BRIEF A-49). Ver .github/workflows/README.md.
  # Solo evalúa en push de 008 o en PR de ramas work/inv-*; en PRs de PI se salta.
  inv-gate:
    runs-on: ubuntu-latest
    needs: [frontera-008, candado-datos-reales, app-008]
    if: always() && (github.event_name == 'push' || startsWith(github.head_ref, 'work/inv-'))
    defaults:
      run:
        working-directory: .
    steps:
      - name: Evaluar veredicto agregado
        run: |
          set -euo pipefail
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ inv-gate: al menos un job requerido falló."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ inv-gate: al menos un job requerido fue cancelado."
            exit 1
          fi
          echo "✅ inv-gate: todos los jobs requeridos pasaron o fueron skipped."
