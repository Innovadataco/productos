# SPEC-466 (follow-up de infra) · Barrido de tensión del piso de tokens:check.
#
# SPEC-466 sacó el piso de la cadena de serialización: el guard es `<=` y ningún
# PR reescribe la constante PISO al bajar crudos. La tensión —apretar el PISO al
# mínimo real— la hace ESTE job, no los PR. Corre sobre `main` fresco:
#   npx tsx scripts/tokens-check.ts --tension
# que reescribe `const PISO = N` si el conteo real bajó (nunca sube; idempotente).
# Si cambió algo, pushea la rama con el piso apretado y el operador abre el PR
# como usuario real (flujo B, SPEC-466); nunca commitea directo a main.
#
# Disparo MANUAL por ahora (workflow_dispatch): el CEO lo corre a mano al cerrar
# cada ola del rediseño. El `schedule` queda comentado, listo para activar cuando
# el ritmo de olas baje y convenga un barrido nocturno.
name: tokens-tension-002-proteccion-infantil

on:
  workflow_dispatch:
  # Activar cuando la Ola 1 cierre y convenga el barrido automático:
  # schedule:
  #   - cron: "0 7 * * *" # 02:00 America/Bogota (07:00 UTC), diario

# Un barrido a la vez; no cancelar uno en curso.
concurrency:
  group: tokens-tension-002
  cancel-in-progress: false

jobs:
  tension:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushea la rama del bot (el operador abre el PR — flujo B)
    defaults:
      run:
        working-directory: 002-2026-PROTECCION-INFANTIL
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # siempre sobre main fresco, nunca una rama vieja
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 002-2026-PROTECCION-INFANTIL/package-lock.json
      - run: npm ci

      # Aprieta el piso al mínimo real. El script solo reescribe si el conteo bajó.
      - name: Apretar el piso al mínimo real
        run: npx tsx scripts/tokens-check.ts --tension

      # ¿Cambió la constante? Si no, no hay nada que abrir.
      - name: ¿Hubo cambios?
        id: diff
        run: |
          if git diff --quiet -- scripts/tokens-check.ts; then
            echo "cambio=no" >> "$GITHUB_OUTPUT"
            echo "El piso ya estaba en el mínimo real. Nada que apretar."
          else
            echo "cambio=si" >> "$GITHUB_OUTPUT"
            git diff -- scripts/tokens-check.ts
          fi

      # Verifica que tras apretar, el guard sigue verde (no rompimos nada).
      - name: Verificar el guard tras apretar
        if: steps.diff.outputs.cambio == 'si'
        run: npm run tokens:check

      # El bot SOLO pushea la rama con el piso apretado — NO abre el PR.
      # Nunca commitea directo a main. La rama `work/pi-SPEC-466-tension` matchea
      # `verificar-base-pr.yml` (^work/pi-SPEC-[0-9]+-...) para que el PR pase el
      # check requerido `verificar_base` del ruleset «Gate CI - main». El
      # force-push reusa la rama en cada corrida; se borra al mergear.
      #
      # ⚠️ Por qué el OPERADOR (usuario real) abre el PR, no el bot — DOS candados
      # de GitHub DISTINTOS, ambos cazados corriendo el job de verdad (D-110):
      #  1. PERMISO DE CREAR PR: con «Allow GitHub Actions to create and approve
      #     pull requests» en OFF (buen default de seguridad; decisión CEO = flujo
      #     (B), SPEC-466), un `gh pr create` desde el workflow falla con
      #     «GitHub Actions is not permitted to create or approve pull requests».
      #     El toggle NO se abre por un job manual de baja frecuencia.
      #  2. ANTI-RECURSIÓN DE CHECKS: un push/PR originado con `GITHUB_TOKEN` NO
      #     dispara otros workflows → los required checks quedarían «pendientes».
      #
      # REMEDIO ÚNICO que resuelve LOS DOS a la vez: el operador abre el PR como
      # usuario real. Eso (a) esquiva el permiso de create —lo abre una persona,
      # no Actions— y (b) origina `pull_request opened` con actor real → los
      # required checks corren solos. El commit vacío YA NO hace falta (era el
      # remedio viejo, que solo atacaba el candado 2 y no el 1).
      - name: Pushear la rama y avisar al operador
        if: steps.diff.outputs.cambio == 'si'
        working-directory: .
        run: |
          set -euo pipefail
          RAMA="work/pi-SPEC-466-tension"
          git config user.email "bot-tokens@innovadataco.local"
          git config user.name "bot-tokens-tension"
          git checkout -B "$RAMA"
          git add 002-2026-PROTECCION-INFANTIL/scripts/tokens-check.ts
          git commit -m "chore(tokens): apretar el piso de tokens:check al mínimo real (SPEC-466 --tension)"
          git push --force origin "$RAMA"
          echo "::notice title=Barrido --tension (SPEC-466)::El piso bajó y la rama $RAMA quedó pusheada. El operador la abre como PR (flujo B): por la UI https://github.com/Innovadataco/productos/pull/new/$RAMA, o con gh: gh pr create --base main --head $RAMA --title 'chore(tokens): apretar el piso al mínimo real (barrido --tension)' --body 'Barrido de tensión de tokens:check (SPEC-466). Piso apretado al mínimo real sobre main fresco; guard <= verde tras apretar.'"
