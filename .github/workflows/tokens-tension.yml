# SPEC-466 (follow-up de infra) · Barrido de tensión del piso de tokens:check.
#
# SPEC-466 sacó el piso de la cadena de serialización: el guard es `<=` y ningún
# PR reescribe la constante PISO al bajar crudos. La tensión —apretar el PISO al
# mínimo real— la hace ESTE job, no los PR. Corre sobre `main` fresco:
#   npx tsx scripts/tokens-check.ts --tension
# que reescribe `const PISO = N` si el conteo real bajó (nunca sube; idempotente).
# Si cambió algo, abre un PR con el piso apretado (nunca commitea directo a main).
#
# Disparo MANUAL por ahora (workflow_dispatch): el CEO lo corre a mano al cerrar
# cada ola del rediseño. El `schedule` queda comentado, listo para activar cuando
# el ritmo de olas baje y convenga un barrido nocturno.
name: tokens-tension-002-proteccion-infantil

on:
  workflow_dispatch:
  # Activar cuando la Ola 1 cierre y convenga el barrido automático:
  # schedule:
  #   - cron: "0 7 * * *" # 02:00 America/Bogota (07:00 UTC), diario

# Un barrido a la vez; no cancelar uno en curso.
concurrency:
  group: tokens-tension-002
  cancel-in-progress: false

jobs:
  tension:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commitea la rama del PR
      pull-requests: write # abre el PR con el piso apretado
    defaults:
      run:
        working-directory: 002-2026-PROTECCION-INFANTIL
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # siempre sobre main fresco, nunca una rama vieja
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 002-2026-PROTECCION-INFANTIL/package-lock.json
      - run: npm ci

      # Aprieta el piso al mínimo real. El script solo reescribe si el conteo bajó.
      - name: Apretar el piso al mínimo real
        run: npx tsx scripts/tokens-check.ts --tension

      # ¿Cambió la constante? Si no, no hay nada que abrir.
      - name: ¿Hubo cambios?
        id: diff
        run: |
          if git diff --quiet -- scripts/tokens-check.ts; then
            echo "cambio=no" >> "$GITHUB_OUTPUT"
            echo "El piso ya estaba en el mínimo real. Nada que apretar."
          else
            echo "cambio=si" >> "$GITHUB_OUTPUT"
            git diff -- scripts/tokens-check.ts
          fi

      # Verifica que tras apretar, el guard sigue verde (no rompimos nada).
      - name: Verificar el guard tras apretar
        if: steps.diff.outputs.cambio == 'si'
        run: npm run tokens:check

      # Abre (o actualiza) un PR con el piso nuevo — nunca commitea directo a main.
      # Con `gh` nativo (GITHUB_TOKEN) — sin action de terceros. La rama del bot
      # matchea `verificar-base-pr.yml` (^work/pi-SPEC-[0-9]+-...) para que su PR
      # pase el check requerido `verificar_base` del ruleset «Gate CI - main».
      # SPEC-466: `bot/…` NO tiene exención en ese patrón → su PR nacería
      # bloqueado; por eso la rama es `work/pi-SPEC-466-tension`.
      #
      # ⚠️ ANTI-RECURSIÓN (trampa de GitHub): un push/PR originado con
      # `GITHUB_TOKEN` NO dispara otros workflows. El PR del bot nace SIN correr
      # `verificar_base` / `pi-gate` / `bi-gate` → esos checks requeridos quedan
      # «pendientes» para siempre → el ruleset «Gate CI - main» lo bloquea igual.
      # Cambiar la rama no lo arregla; el problema es quién origina el evento.
      # Remedio (job de baja frecuencia, sin PAT ni secreto): el operador empuja
      # UN commit vacío a la rama del bot COMO USUARIO REAL, lo que origina el
      # evento `pull_request synchronize` con actor real y dispara los checks:
      #     git fetch origin work/pi-SPEC-466-tension
      #     git switch work/pi-SPEC-466-tension
      #     git commit --allow-empty -m "ci: disparar checks"
      #     git push
      # Con eso corren los required checks → el PR queda mergeable.
      - name: Abrir PR con el piso apretado
        if: steps.diff.outputs.cambio == 'si'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RAMA="work/pi-SPEC-466-tension"
          git config user.email "bot-tokens@innovadataco.local"
          git config user.name "bot-tokens-tension"
          git checkout -B "$RAMA"
          git add 002-2026-PROTECCION-INFANTIL/scripts/tokens-check.ts
          git commit -m "chore(tokens): apretar el piso de tokens:check al mínimo real (SPEC-466 --tension)"
          git push --force origin "$RAMA"
          # Si ya hay un PR abierto para esta rama, el force-push lo actualiza solo.
          if [ -z "$(gh pr list --head "$RAMA" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$RAMA" \
              --title "chore(tokens): apretar el piso al mínimo real (barrido --tension)" \
              --body "Barrido de tensión de \`tokens:check\` (SPEC-466). El conteo real de color crudo bajó por debajo del PISO vigente; este PR aprieta la constante al mínimo medido sobre \`main\` fresco. Guard \`<=\`: los PR que bajan crudos no tocan el PISO; este barrido lo aprieta. Verificado: \`npm run tokens:check\` verde tras apretar.

          **Para mergear:** este PR lo abrió el \`GITHUB_TOKEN\`, así que los checks requeridos NO se dispararon (anti-recursión de GitHub) y aparecen pendientes. Empujá un commit vacío como usuario real para dispararlos: \`git switch work/pi-SPEC-466-tension && git commit --allow-empty -m 'ci: disparar checks' && git push\`."
          else
            echo "PR de tensión ya abierto para $RAMA; el force-push lo actualizó."
          fi
