name: Verificar rama base del PR
on:
    pull_request:
        types: [opened, edited, synchronize, reopened]
# SPEC-396 (I-282): dispara solo en pull_request → nunca corre en main, cancel-in-progress
# a secas es seguro. Sin esto, cada `synchronize` (repush a la rama del PR) dejaba
# vivo el check anterior compitiendo con el nuevo.
concurrency:
    group: verificar-base-${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true
jobs:
    verificar_base:
        runs-on: ubuntu-latest
        steps:
            - name: Rama base debe ser main
              run: |
                  if [ "${{ github.base_ref }}" != "main" ]; then
                      echo "❌ PR base es '${{ github.base_ref }}' — debe ser 'main'."
                      echo "Ver BRIEF-A-47 candado 2. Rebase el PR contra main y reabre."
                      exit 1
                  fi
                  echo "✅ PR base OK (main)."
            - name: Rama de trabajo debe cumplir convención
              run: |
                  BRANCH="${{ github.head_ref }}"
                  if ! echo "$BRANCH" | grep -qE '^work/(pi|bi)-SPEC-[0-9]+-'; then
                      echo "❌ Rama '$BRANCH' no cumple convención work/<producto>-SPEC-NNN-<slug>."
                      echo "Ver BRIEF-A-47 candado 2."
                      exit 1
                  fi
                  echo "✅ Nombre de rama OK ($BRANCH)."
            # SPEC-924: una rama work/pi-SPEC-N-* exige specs/N-*/spec.md con línea Status.
            # Hueco real: SPEC-921 (PR #918) mergeó sin spec.md. Vive en ESTE job porque es check
            # requerido y corre en todo PR (el should-skip de ci.yml puede saltar los de solo
            # workflows). Ramas bi/otras → el script no aplica. Los bots (487/466) pasan porque
            # sus specs existen. Candado: scripts/ci/verificar-spec-de-rama.candado.test.ts.
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: |
                      002-2026-PROTECCION-INFANTIL/specs
                      002-2026-PROTECCION-INFANTIL/scripts/ci
            - name: Rama de PI debe traer su spec.md con Status
              env:
                  BRANCH: ${{ github.head_ref }}
              run: node 002-2026-PROTECCION-INFANTIL/scripts/ci/verificar-spec-de-rama.mjs "$BRANCH"
