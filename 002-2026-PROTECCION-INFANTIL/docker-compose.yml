version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: proteccion
      POSTGRES_PASSWORD: ${DB_PASSWORD:-proteccion_dev}
      POSTGRES_DB: proteccion_infantil
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U proteccion" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi-app-dev
    env_file: .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: "America/Bogota"
      WORKER_RUN_DIR: /app/run
    volumes:
      - pi_worker_run:/app/run
      - pi_apelaciones_storage:/app/storage
    ports:
      - "5005:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pi_worker_run:
  pi_apelaciones_storage:
