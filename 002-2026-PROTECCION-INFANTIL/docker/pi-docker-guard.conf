# SPEC-977 (I-459) · pi-docker-guard — el ÚNICO servicio que monta el docker.sock.
#
# pi-app ya NO monta /var/run/docker.sock: habla con este guard por HTTP interno
# (DOCKER_GUARD_URL=http://pi-docker-guard:2375). El guard deja pasar EXACTAMENTE lo
# que el panel admin necesita y responde 403 a todo lo demás, de modo que un pi-app
# comprometido NO obtiene la API de Docker completa sobre el VPS.
#
# Corre con read_only, cap_drop ALL, no-new-privileges, sin puertos publicados y solo
# en la red interna de PI (ver docker-compose.prod.yml). Sin directiva `user`: el worker
# corre como root para poder conectar al socket (owner root), ya sin capacidades.

# El worker corre como root (dueño del socket root:docker) para poder conectar al
# docker.sock sin CAP_DAC_OVERRIDE (lo quita cap_drop ALL): root casa con el owner.
# Además evita el chown de los temporales a uid 101, que cap_drop ALL impediría.
user root;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;

    # read_only: todos los temporales van a /tmp (tmpfs); nginx los crea al arrancar.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    proxy_http_version 1.1;

    # El demonio de Docker, alcanzable SOLO desde este contenedor por el socket :ro.
    upstream docker {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;
        server_name _;

        # DENEGADO POR DEFECTO: cualquier ruta que no calce con un allow explícito.
        location / {
            return 403;
        }

        # ALLOW 1 · start|stop|restart de EXACTAMENTE los 12 contenedores pi-* del panel.
        # Solo POST; sin query string (un `?` → 403). El prefijo de versión /vX.Y/ es opcional.
        location ~ ^/(v[0-9.]+/)?containers/(pi-worker|pi-monitor|pi-simulador-abuso|pi-notificaciones|pi-senal-comunitaria|pi-analisis-score|pi-vigencia|pi-verificacion-vencimiento|pi-analisis-reglas|pi-expediente-motor|pi-anomalias|pi-citas)/(start|stop|restart)$ {
            limit_except POST {
                deny all;
            }
            if ($query_string != "") {
                return 403;
            }
            # Reenvía el URI NORMALIZADO ($uri), no el crudo del cliente. nginx hace el
            # match de location sobre el normalizado; sin esto, un `/containers/pi-db/../
            # pi-worker/restart` casaría la allowlist pero llegaría CRUDO a Docker. Con $uri,
            # lo reenviado == lo evaluado: un `..`/`%2e%2e` jamás apunta a otro contenedor.
            proxy_pass http://docker$uri;
        }

        # ALLOW 2 · listar contenedores. Solo GET; el guard FUERZA la query (all=true +
        # filtro de nombre anclado `^/pi-`): ignora lo que mande el cliente, así nunca lista
        # ajenos (006/007, buildx, etc.) ni expone otros campos de consulta.
        location ~ ^/(v[0-9.]+/)?containers/json$ {
            limit_except GET {
                deny all;
            }
            set $args 'all=true&filters=%7B%22name%22%3A%5B%22%5E%2Fpi-%22%5D%7D';
            # URI NORMALIZADO + los args forzados (nunca los del cliente).
            proxy_pass http://docker$uri$is_args$args;
        }
    }
}
