services:
  bi-superset:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile.superset
    env_file: .env.bi.production
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${SUPERSET_DB_USER}:${SUPERSET_DB_PASSWORD}@bi-superset-db:5432/${SUPERSET_DB_NAME}
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - bi-superset-home:/home/superset
      - bi-superset-config:/app/superset_home
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    networks:
      - bi-net
    depends_on:
      bi-superset-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  bi-vanna:
    build:
      context: .
      dockerfile: Dockerfile.vanna
    env_file: .env.bi.production
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      REPLICA_DB_HOST: bi-db-replica
      REPLICA_DB_PORT: 5432
      REPLICA_DB_USER: ${REPLICA_DB_USER}
      REPLICA_DB_PASSWORD: ${REPLICA_DB_PASSWORD}
      REPLICA_DB_NAME: ${REPLICA_DB_NAME}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - bi-vanna-cache:/app/cache
    networks:
      - bi-net
    depends_on:
      bi-db-replica:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://localhost:8001/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  bi-telegram:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    env_file: .env.bi.production
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_AUTHORIZED_CHATS: ${TELEGRAM_AUTHORIZED_CHATS}
      VANNA_API_URL: ${VANNA_API_URL}
    volumes:
      - bi-telegram-config:/app/config
    networks:
      - bi-net
    depends_on:
      bi-vanna:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; open('/tmp/bot.pid').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  bi-superset-db:
    image: postgres:16-alpine
    env_file: .env.bi.production
    environment:
      POSTGRES_USER: ${SUPERSET_DB_USER}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
      POSTGRES_DB: ${SUPERSET_DB_NAME}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bi-superset-db-data:/var/lib/postgresql/data
      - ./docker/superset/init-metadata-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - bi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER} -d ${SUPERSET_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bi-db-replica:
    image: pgvector/pgvector:pg16
    env_file: .env.bi.production
    environment:
      POSTGRES_USER: ${REPLICA_DB_USER}
      POSTGRES_PASSWORD: ${REPLICA_DB_PASSWORD}
      POSTGRES_DB: ${REPLICA_DB_NAME}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bi-db-replica-data:/var/lib/postgresql/data
    networks:
      - bi-net
      - pi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REPLICA_DB_USER} -d ${REPLICA_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bi-mv-refresh:
    build:
      context: .
      dockerfile: docker/mv-refresh/Dockerfile.mv-refresh
    env_file: .env.bi.production
    environment:
      PGHOST: bi-db-replica
      PGUSER: ${REPLICA_DB_USER}
      PGPASSWORD: ${REPLICA_DB_PASSWORD}
      PGDATABASE: ${REPLICA_DB_NAME}
    volumes:
      - ./scripts/refresh-mv.sh:/usr/local/bin/refresh-mv.sh:ro
    networks:
      - bi-net
    depends_on:
      bi-db-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  bi-next:
    build:
      context: .
      dockerfile: Dockerfile.next
    env_file: .env.bi.production
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      PI_BASE_URL: ${PI_BASE_URL}
      ENABLE_HTTPS_HEADERS: "true"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - bi-net
    depends_on:
      bi-vanna:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  bi-net:
    driver: bridge
  pi-net:
    external: true
    name: ${PI_NET_NAME}

volumes:
  bi-superset-home:
  bi-superset-config:
  bi-vanna-cache:
  bi-telegram-config:
  bi-superset-db-data:
  bi-db-replica-data:
