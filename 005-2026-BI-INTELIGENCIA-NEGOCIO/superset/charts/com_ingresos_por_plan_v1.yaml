      sqlExpression: "SELECT p.nombre AS plan, COALESCE(SUM(bc.monto), 0) AS ingresos FROM \"BillingCycle\" bc JOIN \"Subscription\" s ON s.id = bc.\"subscriptionId\" JOIN \"Plan\" p ON p.id = s.\"planId\" WHERE bc.estado = 'pagado' AND bc.\"creadoEn\" >= date_trunc('month', NOW() AT TIME ZONE 'America/Bogota') GROUP BY p.nombre ORDER BY ingresos DESC"
