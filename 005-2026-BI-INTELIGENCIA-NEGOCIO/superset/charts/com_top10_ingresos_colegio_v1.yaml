      sqlExpression: "SELECT c.nombre AS colegio, SUM(bc.monto) AS ingresos_cop FROM \"BillingCycle\" bc JOIN \"Subscription\" s ON s.id = bc.\"subscriptionId\" JOIN \"Colegio\"      c ON c.\"tenantId\" = s.\"tenantId\" WHERE bc.\"creadoEn\" >= date_trunc('month', NOW() AT TIME ZONE 'America/Bogota') AND bc.estado = 'pagado' GROUP BY c.nombre ORDER BY ingresos_cop DESC LIMIT 10"
