    sqlExpression: "WITH votos_por_categoria AS (SELECT \"clasificacionIAId\", categoria, count(*) FILTER (WHERE cumple) AS a_favor, count(*) AS votos_totales FROM clasificacion_rubrica_votos WHERE \"creadoEn\" >= NOW() - INTERVAL '7 days' GROUP BY \"clasificacionIAId\", categoria) SELECT ROUND(100.0 * count(*) FILTER (WHERE a_favor >= 2 AND votos_totales >= 2) / NULLIF(count(*), 0), 2) AS tasa_acuerdo_pct FROM votos_por_categoria"
