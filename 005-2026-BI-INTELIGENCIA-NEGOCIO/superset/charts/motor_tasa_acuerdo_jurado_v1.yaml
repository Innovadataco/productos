  metric:
    expressionType: SQL
    sqlExpression: "WITH votos_por_categoria AS (SELECT \"clasificacionIAId\", categoria, count(*) FILTER (WHERE cumple = true) AS votos_a_favor, count(*) AS votos_totales FROM \"clasificacion_rubrica_votos\" WHERE \"creadoEn\" >= NOW() - INTERVAL '7 days' GROUP BY \"clasificacionIAId\", categoria), consenso_por_clasificacion AS (SELECT \"clasificacionIAId\", bool_or(votos_a_favor >= 2 AND votos_totales >= 2) AS hay_consenso FROM votos_por_categoria GROUP BY \"clasificacionIAId\") SELECT ROUND(100.0 * count(*) FILTER (WHERE hay_consenso) / NULLIF(count(*), 0), 2) AS tasa_acuerdo_pct FROM consenso_por_clasificacion"
    label: valor
    hasCustomLabel: true
