# ==========================================================================
# BI v2 (006) — stack de producción en VPS Hostinger.
# SIN Superset, SIN Vanna, SIN Telegram (eliminados para siempre).
# D1: healthcheck + restart + rotación de logs en todo contenedor.
# D2: puerto 127.0.0.1:3001 (liberado por el 005; el proxy de
#     bi.innovadataco.com ya apunta ahí). Red propia, prefijo bi-.
# Fase 1b: bi-db (PostgreSQL 16 + pgvector) y bi-migrate (migraciones/seed).
# ==========================================================================
name: bi-006

services:
  bi-next:
    build: .
    image: bi-006-next:${BI_VERSION:-dev}
    container_name: bi-next
    env_file:
      - .env.bi.production   # lo crea Jelkin (600, fuera de git) — D3d
    ports:
      - "127.0.0.1:${BI_PORT:-3001}:3000"   # puerto libre que dejó el 005; el proxy apunta ahí
    restart: unless-stopped
    depends_on:
      bi-db:
        condition: service_healthy   # la app usa DATABASE_URL → la BD debe estar lista
    healthcheck:
      # 127.0.0.1 y no "localhost": en Alpine, localhost resuelve a ::1 (IPv6)
      # y el server standalone escucha en IPv4 0.0.0.0 → connection refused
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/bi/estado-sistema"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bi-net

  # PostgreSQL 16 + pgvector (extensión vector para el cache semántico:
  # embedding vector(768) de BICacheSemantico). Recibe además la réplica
  # read-only de PI vía pg_logical (publicación bi_replica, que YA EXISTE en
  # el Postgres de PI; la suscripción se activa por script aparte).
  # NUNCA replicar tablas con PII (Usuario/Password/Session) — Ley 1581.
  bi-db:
    image: pgvector/pgvector:pg16
    container_name: bi-db
    env_file:
      - .env.bi.production   # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    # SIN ports: solo red interna bi-net; jamás se expone al host (D2)
    restart: unless-stopped
    healthcheck:
      # $$ escapa el $ para que lo expanda el contenedor, no compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - bi-db-data:/var/lib/postgresql/data
    networks:
      - bi-net
      - pi-red   # red de PI: bi-db alcanza pi-db por nombre para la suscripción pg_logical

  # Migraciones y seed — servicio "tools" DE UN SOLO USO (corre y termina).
  # La imagen standalone de bi-next NO lleva prisma CLI ni tsx: este servicio
  # construye el target `tools` del Dockerfile (node_modules completo).
  # Uso:      docker compose -f docker-compose.bi.yml --profile tools run --rm bi-migrate
  # Seed:     docker compose -f docker-compose.bi.yml --profile tools run --rm bi-migrate npx prisma db seed
  # EXCEPCIÓN D1 documentada: sin healthcheck ni restart — es one-shot y un
  # restart:unless-stopped lo reejecutaría en bucle. Rotación de logs sí.
  bi-migrate:
    build:
      context: .
      target: tools
    image: bi-006-tools:${BI_VERSION:-dev}
    profiles: ["tools"]
    env_file:
      - .env.bi.production   # DATABASE_URL apunta a bi-db:5432 (red interna)
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      bi-db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bi-net

networks:
  bi-net:
    driver: bridge
  # Red externa de PI (compose de PI): bi-db se une SOLO para la suscripción
  # pg_logical (alcanzar pi-db por nombre). Sobreescribible por env.
  pi-red:
    external: true
    name: ${PI_NET_NAME:-002-2026-proteccion-infantil_default}

volumes:
  bi-db-data:
    name: bi-db-data
