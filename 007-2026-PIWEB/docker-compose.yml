services:
  piweb:
    image: nginx:alpine
    container_name: piweb
    restart: always
    ports:
      - "127.0.0.1:5017:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      # SPEC-497 · Tablero de Operación.
      # ⚠️ Montaje ARCHIVO POR ARCHIVO a propósito, no el directorio.
      # Montar `./operacion` como directorio :ro IMPIDE crear dentro el mountpoint
      # del JSON y el contenedor NO ARRANCA (probado en vivo el 05-09: dejó piweb
      # en 502). El JSON vive fuera de git y lo mantiene el CEO por SSH.
      - ./operacion/index.html:/usr/share/nginx/html/operacion/index.html:ro
      - /opt/proteccion-infantil/piweb/operacion.json:/usr/share/nginx/html/operacion/operacion.json:ro
      # SPEC-503 · pestaña «Modelo de datos» (estática). Archivo por archivo, igual que operacion.
      # ⚠️ Mount NUEVO: NO basta `docker restart piweb`; requiere `docker compose up -d`
      # para que nginx tome el bind del archivo nuevo.
      - ./modelo/index.html:/usr/share/nginx/html/modelo/index.html:ro
      # Mapa de arquitectura PI (Archify, HTML autocontenido). Archivo por archivo, igual que modelo.
      - ./arquitectura/index.html:/usr/share/nginx/html/arquitectura/index.html:ro
      - ./arquitectura/sistema/index.html:/usr/share/nginx/html/arquitectura/sistema/index.html:ro
      # Mapas detallados PI (Archify, autocontenidos). Archivo por archivo, igual que modelo.
      - ./flujo-reporte/index.html:/usr/share/nginx/html/flujo-reporte/index.html:ro
      - ./ciclo-vida/index.html:/usr/share/nginx/html/ciclo-vida/index.html:ro
      - ./navegacion/index.html:/usr/share/nginx/html/navegacion/index.html:ro
      - ./cifrado/index.html:/usr/share/nginx/html/cifrado/index.html:ro
      - ./datos/index.html:/usr/share/nginx/html/datos/index.html:ro
      # Procesos por rol (Archify, autocontenidos). Archivo por archivo, igual que modelo.
      - ./proceso-anonimo/index.html:/usr/share/nginx/html/proceso-anonimo/index.html:ro
      - ./proceso-padre/index.html:/usr/share/nginx/html/proceso-padre/index.html:ro
      - ./proceso-colegio/index.html:/usr/share/nginx/html/proceso-colegio/index.html:ro
      - ./proceso-profesional/index.html:/usr/share/nginx/html/proceso-profesional/index.html:ro
      # SPEC-611 · Proceso del equipo interno (operador + comité + verificador).
      # Archivo por archivo, igual que los demás procesos.
      - ./proceso-operacion/index.html:/usr/share/nginx/html/proceso-operacion/index.html:ro
