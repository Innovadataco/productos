# Inversiones (008) · producción en el VPS compartido con PI (D-015). Proyecto, red y base propios.
#
# Una sola variable para todo, incluida la reversa (la arma scripts/produccion-comun.sh; a mano, ver
# docs/despliegue/produccion.md §1). <raíz> es la carpeta que contiene al clon: no va en este repo público (ver
# ESTADO en la gestión).
#   COMPOSE=(env INV_RESPALDOS_DIR=<de inv-008.conf> INV_RUTA_PAUSA=<clon>/scripts/pausar-008.sh
#            docker compose -p inv-008-prod -f <raíz>/repo/008-2026-INVERSIONES/docker-compose.prod.yml
#            --env-file <raíz>/.env.inversiones.production)
#
# El único archivo de producción (<raíz>/.env.inversiones.production, 600 de root, fuera de git) se usa SOLO
# para la interpolación: ningún servicio usa env_file y cada uno declara en environment: solo sus variables. La
# imagen no trae secretos; APP_VERSION va horneada en ella. Las dos variables que no son secretas las pasan los
# scripts con `env` (mandan sobre el --env-file): la carpeta de respaldos (de la configuración no secreta
# <raíz>/inv-008.conf, validada) y la ruta de la pausa (derivada del clon).
# INV_TAG (el sha) lo exporta desplegar-prod.sh; sin él, las imágenes no existen y nada arranca por error.
# Redes: la base solo en la red interna, sin puertos. La app SIN salida a internet: solo en redes internal (la
# interna, con la base, y la de la entrada). La única pieza con el puerto 127.0.0.1:5008 del host (por donde entra
# el túnel de PI, ver docs/despliegue/produccion.md §8) es inv-008-entrada, un relé TCP en node con la imagen de la
# app. Lo que sale a internet (la entrada para publicar y el vigía para Telegram) va en inv-008-red.
# cpu_shares bajo: PI tiene prioridad.
# Sin volcados de memoria en ningún servicio (ulimits core 0).
name: inv-008-prod

services:
  inv-008-db:
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    user: "70:70"
    restart: always
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "effective_cache_size=256MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: inversiones
      # Solo actúa en el primer initdb (volumen nuevo): detecta corrupción de páginas.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      POSTGRES_PASSWORD: ${INV_POSTGRES_CLAVE:?falta INV_POSTGRES_CLAVE}
      TZ: America/Bogota
    volumes:
      - inv-008-db-datos:/var/lib/postgresql/data
    networks:
      - inv-008-red-interna
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    cpu_shares: 256
    pids_limit: 200
    stop_grace_period: 30s
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inversiones"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  inv-008-app:
    image: inv-008-app:${INV_TAG:-sin-desplegar}
    pull_policy: never
    user: "10008:10008"
    restart: always
    init: true
    depends_on:
      inv-008-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${INV_APP_DATABASE_URL:?falta INV_APP_DATABASE_URL}
      AUTH_SECRET: ${INV_AUTH_SECRET:?falta INV_AUTH_SECRET}
      CIFRADO_CLAVE_ACTIVA: ${INV_CIFRADO_CLAVE_ACTIVA:?falta INV_CIFRADO_CLAVE_ACTIVA}
      CIFRADO_CLAVE_V1: ${INV_CIFRADO_CLAVE_V1:?falta INV_CIFRADO_CLAVE_V1}
      APP_ORIGEN: ${APP_ORIGEN:?falta APP_ORIGEN}
      # El token de los pedidos a demanda al servicio inv-008-ia («Identificar» y «Probar» de /edicion/ia). Opcional:
      # sin él, la pantalla dice que la conexión está pendiente. La app NO recibe la credencial de inv_ia.
      INV_IA_SERVICIO_TOKEN: ${INV_IA_SERVICIO_TOKEN:-}
      # La carpeta (dentro del contenedor) con la lista de modelos locales que publica PI: ver el montaje.
      INV_IA_DIR_COMPARTIDA: /compartido-pi
      NODE_OPTIONS: --max-old-space-size=256
      TZ: America/Bogota
    # La lista de modelos de PI, en solo lectura. La ruta del host no va en el repo: sale del archivo de producción
    # (INV_IA_DIR_COMPARTIDA, una ruta absoluta). Sin ella se monta un volumen vacío: «sin lista de PI», sin caerse.
    volumes:
      - ${INV_IA_DIR_COMPARTIDA:-inv-008-ia-sin-lista}:/compartido-pi:ro
    # Sin puertos y sin salida a internet: solo redes internal. Del túnel la separa inv-008-entrada. Al servicio de IA
    # le habla por la red interna (http://inv-008-ia:8008, fijo en el código).
    networks:
      - inv-008-red-interna
      - inv-008-red-entrada
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=10008,gid=10008,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    cpu_shares: 256
    pids_limit: 200
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5008/api/salud || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Relé TCP (capa 4) entre el puerto del túnel y la app: copia bytes sin leer ni tocar el HTTP, así que
  # Cf-Connecting-IP (los topes por IP), el Host y las cabeceras de seguridad de la app pasan tal cual. Una red
  # internal no publica puertos: por eso la app (sin salida) necesita esta pieza en inv-008-red. Va con la imagen de
  # la app (toda imagen anterior trae node: la vuelta atrás con el sha anterior la levanta igual) y su código vive
  # aquí, no en la imagen; tests/unit/produccion/entrada.test.ts lo ejecuta. Destino fijo (no es un relé abierto),
  # sin variables ni secretos, sin volúmenes y sin log de los clientes. Argumentos: destino, puerto del destino,
  # puerto propio, inactividad en segundos y máximo de conexiones. Medido en el Mac: ~9 MiB en reposo y 14,7 MiB de
  # pico con 60 conexiones quietas.
  inv-008-entrada:
    image: inv-008-app:${INV_TAG:-sin-desplegar}
    pull_policy: never
    user: "10008:10008"
    restart: always
    init: true
    depends_on:
      inv-008-app:
        condition: service_healthy
    entrypoint:
      - node
      - --max-old-space-size=16
      - -e
      - |
        "use strict";
        const net = require("node:net");
        const [destino, textoDestino, textoPuerto, textoInactivo, textoMaximo] = process.argv.slice(1);
        // Sin el signo de dólar en todo el script: Compose lo interpolaría.
        const entero = (t, min, max) => {
          const n = Number.parseInt(t || "", 10);
          return String(n) === t && n >= min && n <= max ? n : NaN;
        };
        const puertoDestino = entero(textoDestino, 1, 65535);
        const puerto = entero(textoPuerto, 1, 65535);
        const inactivoMs = entero(textoInactivo, 1, 3600) * 1000;
        const maximo = entero(textoMaximo, 1, 1024);
        const destinoValido = typeof destino === "string" && destino.length > 0 && destino.length <= 253 && !/[^a-z0-9.-]/.test(destino);
        if (!destinoValido || [puertoDestino, puerto, inactivoMs, maximo].some(Number.isNaN)) {
          process.stderr.write("[entrada] argumentos inválidos: destino puerto-destino puerto inactividad-s máximo\n");
          process.exit(64);
        }
        const CONECTAR_MS = 5000;
        const servidor = net.createServer({ allowHalfOpen: true }, (cliente) => {
          const app = net.connect({ host: destino, port: puertoDestino, allowHalfOpen: true });
          const cortar = () => {
            clearTimeout(espera);
            cliente.destroy();
            app.destroy();
          };
          const espera = setTimeout(cortar, CONECTAR_MS);
          app.once("connect", () => clearTimeout(espera));
          for (const lado of [cliente, app]) {
            lado.setTimeout(inactivoMs, cortar);
            lado.on("error", cortar);
          }
          cliente.pipe(app);
          app.pipe(cliente);
        });
        servidor.maxConnections = maximo;
        servidor.on("error", (error) => {
          process.stderr.write("[entrada] no se pudo escuchar: " + error.code + "\n");
          process.exit(1);
        });
        servidor.listen(puerto, "0.0.0.0", () => process.stdout.write("[entrada] relé TCP listo: " + puerto + " hacia " + destino + ":" + puertoDestino + "\n"));
      - inv-008-app
      - "5008"
      - "5008"
      - "120"
      - "64"
    ports:
      - "127.0.0.1:5008:5008"
    networks:
      - inv-008-red
      - inv-008-red-entrada
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.25
    cpu_shares: 256
    # node cuenta sus hilos (libuv, V8) como pids; el healthcheck suma uno.
    pids_limit: 32
    ulimits:
      core: 0
    # De punta a punta por el relé, con el wget de la imagen. Nunca un segundo node: no cabe en 32m.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:5008/api/salud"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Un solo uso (desplegar-prod.sh: `run --rm`): migraciones, guardián del esquema y privilegios de
  # inv_app, antes de levantar la app. También corre los comandos de carga y de acceso inicial.
  inv-008-migrador:
    image: inv-008-migrador:${INV_TAG:-sin-desplegar}
    pull_policy: never
    profiles: [migrar]
    user: "10008:10008"
    # Excepción a restart: always (capas-pi.md #5): es de un solo uso y no debe volver a correr solo.
    restart: "no"
    depends_on:
      inv-008-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${INV_DUENO_DATABASE_URL:?falta INV_DUENO_DATABASE_URL}
      # crear-acceso-inicial.ts imprime ${APP_ORIGEN}/definir-clave#t=<token>.
      APP_ORIGEN: ${APP_ORIGEN:?falta APP_ORIGEN}
      CIFRADO_CLAVE_ACTIVA: ${INV_CIFRADO_CLAVE_ACTIVA:?falta INV_CIFRADO_CLAVE_ACTIVA}
      CIFRADO_CLAVE_V1: ${INV_CIFRADO_CLAVE_V1:?falta INV_CIFRADO_CLAVE_V1}
      TZ: America/Bogota
    networks:
      - inv-008-red-interna
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    cpu_shares: 256
    pids_limit: 200
    # La carga del dueño pasa por aquí (inv-cargar): sin volcados de memoria.
    ulimits:
      core: 0
    # Healthcheck nominal: es de un solo uso (run --rm) y nunca queda corriendo.
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Respaldo diario cifrado, permanente y con programación propia (sin systemd ni cron del host):
  # pg_dump -Fc (rol inv_dueno, red interna) | age -r <pública> → la carpeta de respaldos (root:respaldo 750, la
  # montó el CEO de PI y la infraestructura de IDC la copia al Mac). Su ruta no va en el repo: sale de la
  # configuración no secreta (INV_RESPALDOS_DIR, validada por los scripts). Solo la clave PÚBLICA de age.
  # ÚNICA excepción a «no root» (capas-pi.md #4): corre como root DEL CONTENEDOR con el grupo respaldo
  # (INV_RESPALDO_GID, gid numérico del host), para dejar los archivos root:respaldo 0640 sin cambiar esa
  # carpeta. Sin ninguna capacidad (no salta permisos ni cambia dueños), sin escalar, de solo lectura y con
  # un único bind de escritura, en sintaxis larga y sin crear la carpeta: con el valor por defecto (una ruta que
  # no existe) ningún comando falla al interpolar, y un up del respaldo sin la carpeta configurada falla cerrado.
  # nosuid y noexec no van aquí: Docker no los aplica a un bind (el kernel ignora esos bits en el bind inicial; el
  # ensayo mostró rw,relatime) y solo cubrirían la vista del contenedor. Van en el montaje del HOST de la carpeta
  # (lo hace el CEO de PI) y los scripts lo revisan (revisar_montaje_respaldos).
  inv-008-respaldo:
    image: inv-008-vigia:${INV_TAG:-sin-desplegar}
    pull_policy: never
    user: "0:${INV_RESPALDO_GID:?falta INV_RESPALDO_GID}"
    restart: always
    init: true
    entrypoint: ["/usr/local/bin/inv-respaldo"]
    depends_on:
      inv-008-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${INV_DUENO_DATABASE_URL:?falta INV_DUENO_DATABASE_URL}
      AGE_PUBLICA: ${INV_AGE_PUBLICA:?falta INV_AGE_PUBLICA}
      RESPALDO_HORA: ${INV_RESPALDO_HORA:-0230}
      RESPALDO_GID: ${INV_RESPALDO_GID:?falta INV_RESPALDO_GID}
      TZ: America/Bogota
    volumes:
      - type: bind
        source: ${INV_RESPALDOS_DIR:-/nonexistent/inv-008-respaldos-sin-configurar}
        target: /respaldos
        bind:
          create_host_path: false
    networks:
      - inv-008-red-interna
    read_only: true
    tmpfs:
      - /run/respaldo
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    cpu_shares: 256
    pids_limit: 20
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD", "/usr/local/bin/inv-respaldo", "--salud"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Vigía de convivencia con PI: SOLO AVISA por Telegram (memoria del VPS y OOM de cualquier contenedor).
  # Sin el socket de Docker: lee /proc/meminfo y /sys/fs/cgroup del host en solo lectura. Nunca monta
  # /var/lib/docker (tiene secretos de otros proyectos). Salida a internet solo para la API de Telegram
  # (lo limita el código: la red no filtra por dominio).
  inv-008-vigia:
    image: inv-008-vigia:${INV_TAG:-sin-desplegar}
    pull_policy: never
    user: "10008:10008"
    restart: always
    # init: sh como PID 1 ignora SIGTERM; con init el vigía se detiene sin esperar al SIGKILL.
    init: true
    entrypoint: ["/usr/local/bin/inv-vigia"]
    environment:
      TELEGRAM_BOT_TOKEN: ${INV_TELEGRAM_BOT_TOKEN:?falta INV_TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${INV_TELEGRAM_CHAT_ID:?falta INV_TELEGRAM_CHAT_ID}
      VIGIA_UMBRAL_MEMAVAILABLE_MIB: ${INV_VIGIA_UMBRAL_MEMAVAILABLE_MIB:-1024}
      VIGIA_INTERVALO_S: ${INV_VIGIA_INTERVALO_S:-60}
      # El comando de corte del aviso: la ruta de pausar-008.sh, derivada del clon por los scripts. Vacía (un
      # vigía recreado a mano), el aviso lleva el marcador.
      VIGIA_RUTA_PAUSA: ${INV_RUTA_PAUSA:-}
    volumes:
      - /proc/meminfo:/host/meminfo:ro
      - /sys/fs/cgroup:/host/cgroup:ro
      # La huella del servicio de precios (solo lectura): para avisar si el ciclo por minuto queda detenido por Yahoo.
      - inv-008-precios-estado:/precios-estado:ro
    networks:
      - inv-008-red
    read_only: true
    tmpfs:
      - /run/vigia:uid=10008,gid=10008,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.05
    cpu_shares: 256
    pids_limit: 20
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD", "/usr/local/bin/inv-vigia", "--salud"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Servicio de precios (D-018): de lunes a viernes a las 18:00 COT trae los cierres de Yahoo y el valor de unidad de
  # la SFC, una vez al día, con plazo por tarea y sin reintentos (src/servicio-precios/).
  # Además, durante la rueda (lunes a viernes, 09:30 a 16:25 COT por omisión) trae cada minuto las barras de 1 minuto de
  # Yahoo de las especies con posición o con regla en el plan y las guarda en precio_intradia, sin duplicar (ciclo aparte, con
  # su plazo y su espera exponencial ante un 429; la depuración de lo de más de 60 días, una vez al día). La imagen de la app con otro
  # entrypoint: el bundle /app/precios/servicio-precios.mjs en modo «bucle», que corre cada tarea como un proceso hijo
  # del mismo bundle. La carga histórica, a pedido y sin levantar la base si está en pausa:
  #   "${COMPOSE[@]}" run --rm -T --no-deps inv-008-precios --ahora --desde AAAA-MM-DD
  # - Solo la credencial del rol inv_precios, y opcional (${…:-}, nunca :?): sin el secreto NO se cae, queda en
  #   espera con latido (healthy) y lo dice en el log; con :? fallarían la pausa y los up de todo el proyecto. Ni
  #   claves de cifrado, ni AUTH_SECRET, ni Telegram.
  # - Red: la interna (la base) y inv-008-red-precios, con salida y solo para él, con la subred del pool de Docker.
  #   La red no filtra por destino: lo limita el código (src/servicio-precios/buscador.ts): solo Yahoo query1 y la SFC
  #   www.datos.gov.co por https, redirect "error", y solo a IPv4 públicas (nunca la puerta de enlace ni la IP del
  #   host vista desde el contenedor).
  # - Huella para el vigía (PR 4) en el volumen inv-008-precios-estado (/estado): bucle (latido y estado, cada
  #   minuto: es el healthcheck), ultima-corrida y corrida.candado, en clave=valor (src/servicio-precios/estado.ts).
  # - 96m sin swap, también con el hijo. Medido en el Mac (arm64 nativo, 2026-11-21; el VPS es amd64 y se mide allí con
  #   medir-memoria.sh): en espera 14 MiB (pico 17) y 13 pids; una corrida de 10 días, pico de 41 MiB y 34 pids; la
  #   carga de un año, pico de 52 MiB. Sin OOM y sin /tmp (no lo necesita).
  inv-008-precios:
    image: inv-008-app:${INV_TAG:-sin-desplegar}
    pull_policy: never
    user: "10008:10008"
    restart: always
    init: true
    depends_on:
      inv-008-db:
        condition: service_healthy
    entrypoint: ["node", "--max-old-space-size=64", "/app/precios/servicio-precios.mjs"]
    command: ["bucle"]
    environment:
      DATABASE_URL: ${INV_PRECIOS_DATABASE_URL:-}
      TZ: America/Bogota
      # Precios cada minuto durante la rueda (segunda ranura del bucle, src/servicio-precios/intradia.ts). Todas opcionales y
      # vacías por omisión: los valores por omisión viven en un solo lugar, src/servicio-precios/intradia-configuracion.ts
      # (APAGADO, 60 s entre ciclos, 09:30 a 16:25 COT, 500 ms entre peticiones, 60 días de retención y el host query1 de Yahoo; INV_INTRADIA_HOST_YAHOO elige query1 o query2).
      # Apagado por omisión: INV_INTRADIA_ENCENDIDO=1 lo enciende (lo decide Jelk); =0 o vacío lo apaga sin tocar la corrida de las 18:00.
      INV_INTRADIA_ENCENDIDO: ${INV_INTRADIA_ENCENDIDO:-}
      INV_INTRADIA_CICLO_SEG: ${INV_INTRADIA_CICLO_SEG:-}
      INV_INTRADIA_DESDE_COT: ${INV_INTRADIA_DESDE_COT:-}
      INV_INTRADIA_HASTA_COT: ${INV_INTRADIA_HASTA_COT:-}
      INV_INTRADIA_PAUSA_MS: ${INV_INTRADIA_PAUSA_MS:-}
      INV_INTRADIA_RETENCION_DIAS: ${INV_INTRADIA_RETENCION_DIAS:-}
      INV_INTRADIA_HOST_YAHOO: ${INV_INTRADIA_HOST_YAHOO:-}
    volumes:
      - inv-008-precios-estado:/estado
    networks:
      - inv-008-red-interna
      - inv-008-red-precios
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.25
    cpu_shares: 256
    # node, su hijo (la tarea), los hilos de libuv y V8 y los del engine de Prisma, más el healthcheck.
    pids_limit: 64
    # SIGTERM al bucle: detiene al hijo (SIGTERM, 5 s de gracia y SIGKILL) antes de que Docker lo mate.
    stop_grace_period: 15s
    ulimits:
      core: 0
    # El latido de menos de 3 minutos, con el find y el grep de busybox (sin un segundo node: no cabe en 96m).
    healthcheck:
      test: ["CMD-SHELL", "find /estado/bucle -mmin -3 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Servicio de IA (E6, D-026): el ÚNICO que llega al Ollama del Mac, por la tailnet y por el mismo camino que PI. A la
  # hora de config_ia (19:00 por omisión), en días hábiles de la BVC, arma los hechos, le pide el resumen al modelo, lo
  # valida y lo registra (src/servicio-ia/); y atiende los pedidos a demanda de la app («Identificar» y «Probar»).
  # - La imagen de la app con el bundle /app/ia/servicio-ia.mjs. Con una imagen ANTERIOR al servicio (la vuelta atrás),
  #   que no trae el bundle, queda en espera (sano) en vez de reiniciarse sin fin: ni el despliegue ni la reanudación
  #   necesitan saber si la imagen lo trae. Sin signo de dólar en el script: Compose lo interpolaría.
  # - Solo la credencial del rol inv_ia y el token de la app, opcionales (${…:-}, nunca :?): sin la credencial NO se cae,
  #   queda en espera con latido; sin el token, no abre el endpoint. Ni claves de cifrado, ni AUTH_SECRET, ni Telegram,
  #   ni la llave de la nube (esa puerta queda apagada aquí).
  # - El destino del Ollama NO va aquí ni en el repo: va en config_ia, en la base (lo guarda Jelk en /edicion/ia), y el
  #   código solo acepta una IPv4 de la tailnet con /api/tags y /api/generate (src/ia/local/destino.ts).
  # - Red: la interna (la base; y la app le habla por ahí al puerto 8008, que NO se publica) y inv-008-red-ia, con salida
  #   y solo para él. La red no filtra por destino: lo limitan el código y la regla de firewall del host que pone PI
  #   sobre el puente de nombre fijo (br-inv008-ia).
  # - 128m sin swap: el tope del plan (96 a 128 MiB). SIN MEDIR en el VPS: se mide allí con medir-memoria.sh.
  inv-008-ia:
    image: inv-008-app:${INV_TAG:-sin-desplegar}
    pull_policy: never
    user: "10008:10008"
    restart: always
    init: true
    depends_on:
      inv-008-db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -r /app/ia/servicio-ia.mjs ]; then exec node --max-old-space-size=96 /app/ia/servicio-ia.mjs bucle; fi
        echo "[ia] esta imagen no trae el servicio de IA (es anterior a él): en espera"
        while :; do sleep 3600; done
    environment:
      DATABASE_URL: ${INV_IA_DATABASE_URL:-}
      INV_IA_SERVICIO_TOKEN: ${INV_IA_SERVICIO_TOKEN:-}
      INV_IA_DIR_COMPARTIDA: /compartido-pi
      TZ: America/Bogota
    volumes:
      - ${INV_IA_DIR_COMPARTIDA:-inv-008-ia-sin-lista}:/compartido-pi:ro
    networks:
      - inv-008-red-interna
      - inv-008-red-ia
    read_only: true
    # El latido (el healthcheck): 64k en memoria, del usuario 10008.
    tmpfs:
      - /estado:uid=10008,gid=10008,mode=0700,size=64k,nosuid,nodev,noexec
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    cpu_shares: 256
    # node, los hilos de libuv y V8 y los del engine de Prisma, más el healthcheck.
    pids_limit: 64
    stop_grace_period: 15s
    ulimits:
      core: 0
    # El latido de menos de 3 minutos, con el find y el grep de busybox (sin un segundo node). Una imagen sin el
    # bundle está en espera: sana.
    healthcheck:
      test: ["CMD-SHELL", "[ ! -r /app/ia/servicio-ia.mjs ] || find /estado/bucle -mmin -3 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Las dos redes internal aíslan además la puerta de enlace (gateway_mode_ipv4: isolated, Docker 28 o más): el puente
# no tiene dirección del host, así que desde ellas no se llega ni a internet ni al HOST (sin aislar se llegaba a los
# servicios del host por su puerta de enlace). El DNS de Docker y los vecinos de la misma red siguen funcionando.
networks:
  # La base, el migrador, el respaldo y la app: sin salida, sin puertos y sin llegar al host.
  inv-008-red-interna:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  # Solo la app y la entrada: sin salida (la app no llega a internet por aquí) y sin llegar al host.
  inv-008-red-entrada:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  # Con salida: la entrada (para publicar 127.0.0.1:5008) y el vigía (Telegram). Ni la app ni la base.
  inv-008-red:
    driver: bridge
  # Con salida, solo para el servicio de precios (Yahoo y la SFC): un puente propio, con la subred del pool de Docker
  # (sin ipam), sin IPv6 y sin nadie más. No se aísla la puerta de enlace: por ella sale a internet. Que no abra
  # conexiones a la IP del host lo garantiza su código (src/servicio-precios/direcciones.ts); además, el puente lleva
  # un nombre fijo (br-inv008-prec, 14 caracteres: el tope de Linux es 15) para la regla de firewall del host que pone
  # PI (lo que entra por ese puente, sin acceso al host). Un nombre fijo es único en el host: un solo proyecto a la vez.
  inv-008-red-precios:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-inv008-prec
  # Con salida, solo para el servicio de IA (el Ollama del Mac por la tailnet): un puente propio, con la subred del pool
  # de Docker (sin ipam), sin IPv6 y sin nadie más, con nombre fijo (br-inv008-ia, 12 caracteres) para la regla de
  # firewall del host que pone PI: lo que entra por ese puente solo sale hacia el Mac y no llega al host.
  inv-008-red-ia:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-inv008-ia

volumes:
  inv-008-db-datos:
  # Lo que se monta en /compartido-pi cuando el archivo de producción no trae INV_IA_DIR_COMPARTIDA: un tmpfs vacío de
  # 64k (la app y el servicio de IA quedan «sin lista de PI», sin caerse).
  inv-008-ia-sin-lista:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,mode=0555,nosuid,nodev,noexec"
  # La huella del servicio de precios para el vigía (src/servicio-precios/estado.ts): un tmpfs local de 64k, del
  # usuario 10008 (0700; el vigía también es 10008), nosuid, nodev y noexec: sin disco y sin crecer. Se vacía cuando
  # ningún contenedor lo usa (pausa, down, reinicio). Sus opciones no se cambian en caliente: cambiarlas exige
  # borrar el volumen (y borrar volúmenes está prohibido en producción), así que quedan fijas desde el principio.
  inv-008-precios-estado:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,uid=10008,gid=10008,mode=0700,nosuid,nodev,noexec"
