services:
  app:
    image: node:22
    container_name: pgn-simulacro
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5018:3000"
    command: sh -c "npm install && npm run db:seed && npm start"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
